# configs/cloud.yml
# Settings for AWS MSK + S3 (populated in Phase 6)

environment: cloud

kafka:
  bootstrap_servers: "REPLACE_WITH_MSK_ENDPOINT"
  topic: "product_events"
  num_partitions: 6
  replication_factor: 3

storage:
  bronze: "s3://lakehouse-bronze-191367600538/events/"
  silver: "s3://lakehouse-silver-191367600538/events/"
  gold:   "s3://lakehouse-gold-191367600538/metrics/"
  checkpoints: "s3://lakehouse-checkpoints-191367600538/"

producer:
  total_events: 100_000_000   # 100M events for scale-out
  batch_size: 5000
  skew_ratio: 0.80
  viral_product_count: 10
  total_products: 10_000
  total_users: 1_000_000
