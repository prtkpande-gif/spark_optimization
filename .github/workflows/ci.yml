name: Lakehouse CI

on:
  push:
    branches:
      - "feature/**"
      - "develop"

  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Install dependencies
        run: |
          pip install pyspark==3.4.1 \
          delta-spark==2.4.0 \
          kafka-python==2.0.2 \
          faker==19.0.0 \
          pytest==7.4.0 \
          chispa==0.9.2

      - name: Run tests
        env:
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          LAKEHOUSE_ENV: local
        run: pytest test/ -v --tb=short




